{% extends 'base.html' %}{% block title %}Edit Listing | UniFind{% endblock %}{% block content %}<section class="listing-form-wrap"><div class="form-heading"><p class="eyebrow">YOUR LISTING</p><h1>Edit listing</h1><p>Update the details below. Leave the photo unchanged to keep the current image.</p></div><form class="form-card listing-form" method="post" enctype="multipart/form-data"><div class="field-row"><label>Item name<input name="item_name" maxlength="120" value="{{ item.item_name }}" required></label><label>Item type / category<select name="category" required>{% for c in categories %}<option value="{{ c }}" {% if item.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label></div><label>Description<textarea name="description" rows="4" maxlength="5000" required>{{ item.description }}</textarea></label><div class="field-row"><label>Campus location<select name="location" required>{% for l in campus_locations %}<option value="{{ l }}" {% if item.location == l %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></label><label>Date<input type="date" name="date" value="{{ item.date.isoformat() }}" required></label></div>{% if item.image_filename %}<p class="current-photo">Current photo: <a href="{{ url_for('uploaded_file', filename=item.image_filename) }}" target="_blank" rel="noopener">View image</a></p>{% endif %}<label class="upload-field">Replace photo <span class="muted">(optional · PNG, JPG, GIF, WEBP · max 5 MB)</span><input type="file" name="photo" accept="image/png,image/jpeg,image/gif,image/webp"></label><div class="form-actions"><a class="text-link" href="{{ url_for('browse') }}">Cancel</a><button class="button primary" type="submit">Save changes →</button></div></form></section>{% endblock %}
