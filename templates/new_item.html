{% extends 'base.html' %}{% block title %}Post {{ listing_type|title }} Item | UniFind{% endblock %}{% block content %}<section class="listing-form-wrap"><div class="form-heading"><p class="eyebrow">HELP THE COMMUNITY</p><h1>Post a {{ listing_type|lower }} item</h1><p>Share the details so the right person can find it.</p></div><form class="form-card listing-form" method="post" enctype="multipart/form-data"><div class="field-row"><label>Item name<input name="item_name" maxlength="120" placeholder="e.g. Blue water bottle" required></label><label>Item type / category<select name="category" required><option value="">Choose a category</option>{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label></div><label>Description<textarea name="description" rows="4" placeholder="Add a few helpful details..." required></textarea></label><div class="field-row"><label>Campus location<select name="location" required><option value="">Choose a location</option>{% for l in campus_locations %}<option>{{ l }}</option>{% endfor %}</select></label><label>Date {{ 'lost' if listing_type == 'LOST' else 'found' }}<input type="date" name="date" required></label></div><label class="upload-field">Photo <span class="muted">(optional · PNG, JPG, GIF, WEBP · max 5 MB)</span><input type="file" name="photo" accept="image/png,image/jpeg,image/gif,image/webp"></label><div class="form-actions"><a class="text-link" href="{{ url_for('browse') }}">Cancel</a><button class="button primary" type="submit">Post {{ listing_type|title }} item <span>→</span></button></div></form></section>{% endblock %}
